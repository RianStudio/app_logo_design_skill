<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Rian app icon template (graphite line style). Copy this file and change only the parts marked TODO.
    Example: Tide, a focus timer: a stopwatch drawn in one line whose coral sector is 25 of 60 minutes
    (examples/tide.svg).
    The style: 1 to 4 connected lines, all 60 px wide with round caps and joins (the same line as the UI's
    Lucide icons), on a graphite gradient; one translucent white volume (a flat solid shape inside the
    object, behind the lines, its edge hidden under them); exactly one accent, a FILLED shape; every gap
    between two lines, and between a line and the accent, at least one line width (60). No fills in the
    body, no letters, no glow, no shadows, no filters: iOS 26 adds the Liquid Glass light itself. Tools, image, video and AI apps also carry their category mark (references/style.md, 类别记号).
    Every number lives in references/style.md. Layers, attributes, geometry recipes and variants:
    references/construction.md. Check with python3 scripts/render.py icon.svg -o renders plus the variants flag
    (one metrics line per rule, PASS / FAIL / INFO). Never put two hyphens in a row inside a comment:
    the SVG stops loading.
  -->
  <defs>
    <!-- bg: graphite #26282B → #191C1F, fixed: do not change. Draw the default look only;
         render.py makes the light, dark, mono and small versions (variants flag). -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26282B"/>
      <stop offset="1" stop-color="#191C1F"/>
    </linearGradient>
    <!-- TODO line gradient: colours fixed (#F8F9FB → #C6C8CB, a top light), only y1 and y2 change.
         Span 600 px after scaling = 600 ÷ k in source units, centred on the vertical range of ALL lines,
         line width included. Here k = 1: crown top y 136 (166 − 30) to ring bottom 830, centre 483, so y1 183,
         y2 783. When it is off, render.py's 线渐变 line prints the y1 and y2 to write.
         The id stays body-fill (body is the group's id; a duplicate id FAILs). Two opaque stops, nothing between. -->
    <linearGradient id="body-fill" x1="0" y1="183" x2="0" y2="783" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#C6C8CB"/>
    </linearGradient>
    <!-- TODO accent gradient: ONE colour from the palette in style.md, light → main; with data-category it is
         that category's colour (tools blue, image yellow, video coral, AI purple, health and finance green).
         Span 480 ÷ k, centred on the accent shape's vertical range.
         Here: coral #FF9C86 → #EC5B45; the sector runs y 394..676 (centre 535), so y1 295, y2 775.
         Two opaque stops, exactly the palette pair: a third colour or a highlight band FAILs. -->
    <linearGradient id="accent" x1="0" y1="295" x2="0" y2="775" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9C86"/>
      <stop offset="1" stop-color="#EC5B45"/>
    </linearGradient>
  </defs>

  <!-- background: this one rect, 0 0 1024 1024, nothing inside it; no other graphics beside it and #subject -->
  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- TODO data-shape: circle | square | tall | wide for a closed line drawing, or open for a drawing with
       gaps or a composite (a frame broken round a person, a cloud plus sun). It picks the size check: filled
       silhouette 0.90 to 1.10 × Tide's, or for open the convex hull 0.90 to 1.15 × Tide's hull. Keylines to
       start from, measured on the lines' outer edge: circle 600, square 540 × 540, tall 480 × 600,
       wide 600 × 480; open is sized by its hull (about 290k px²); long side ≤ 720.
       TODO data-category: tools | image | video | ai | health | finance; leave it out for an app outside these
       (Tide, a focus timer, has none). It fixes the accent colour and the mark: tools one horizontal straight
       line across the whole drawing (centre at 35 to 75 % of its height), image a whole round sun (r ≥ 72) in
       the top left corner, video a play triangle drawn in line on its own (scripts/shapes.py play, H ≥ 240 ÷ k),
       AI a 45° chamfer in the outline's lower right corner with a band running "/" beside it (scripts/shapes.py
       aiband, data-accent="band" on the accent, never on a circle). Green only for health and finance, the band
       only for AI.
       TODO transform: translate(512 512) scale(k) translate(-512 -512) translate(tx ty). Draw in final pixels
       with k = 1. When the size line FAILs it prints the k to use; then stroke-width becomes 60 ÷ k and the
       corners and accent are redone with shapes.py and its k flag. translate puts the filled silhouette's
       centroid within 12 of (512, 512); when it FAILs the centroid line prints the translate to write.
       Here: k = 1, up 20; ring 560 across, outer box 560 × 694. -->
  <g id="subject" data-shape="circle" transform="translate(512 512) scale(1) translate(-512 -512) translate(0 -20)">
    <!-- TODO volume: ONE flat shape that fills the object's inside, drawn BEFORE #body: fill #FFFFFF with
         fill-opacity 0.14, no stroke, no opacity, no gradient. Its outline follows the lines' CENTRE line, so its
         edge hides under the strokes (render.py: ≥ 90 % of the edge under a line, nothing spilling outside the
         hull). It is Icon Composer group 1, behind the lines (group 2) and the accent (group 3); the accent may
         sit on it. Open shapes close along a line's centre line. A drawing with no inside (two arrows) leaves it
         out and puts data-volume="none" on #subject.
         Here: the ring's inside, r 250 = the ring's centre line. -->
    <circle id="volume" cx="512" cy="550" r="250" fill="#FFFFFF" fill-opacity="0.14"/>
    <!-- TODO lines: the centre line of every stroke inside this one group, which carries the stroke: no fill,
         stroke, stroke-width or opacity on the elements themselves. stroke-width = 60 ÷ k.
         Rules: 1 to 4 connected lines, one metaphor; two separate lines at least 60 apart edge to edge (their
         centre lines 120); no gap narrower than a line inside one line either (corners at least 45°, holes at
         least 60 across); a line that ends near another stops 90 from its centre line, or ends ON it (a joint).
         Corners: rounded rectangles r ≥ 56, polygon corners ≥ 24. Centre lines from scripts/shapes.py (arc, rrect,
         bubble, poly with the open flag for a polyline, play); circle, rect, line and polyline bake too. -->
    <g id="body" fill="none" stroke="url(#body-fill)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
      <!-- ring: centre line r 250 round (512, 550), so the stroke runs from r 220 to r 280 -->
      <circle cx="512" cy="550" r="250"/>
      <!-- crown 120 wide on a stem that ends on the ring's centre line (y 300): one connected line -->
      <path d="M 452 166 H 572 M 512 166 V 300"/>
    </g>
    <!-- TODO accent shape: ONE filled element (path, circle, or g of paths), fill url(#accent), no stroke,
         drawn after #body. Best the most meaningful part of the object (the progress, the sun, the pulled-out
         slice); at least 60 from every line, never touching it; 6 to 20 % of the silhouette's convex hull (the
         AI band: data-accent="band", 6 to 14 %). No opacity of its own.
         Here: 25 of 60 minutes = 150°, from 12 o'clock (−90°) clockwise to 60°, R 158, corners 24;
         the ring's inner edge is r 220, 62 away.
         python3 scripts/shapes.py sector 512 550 158 -90 60 24 -->
    <path id="accent-shape" fill="url(#accent)" d="M 512.0 543.6 L 512.0 418.2 A 24 24 0 0 1 540.3 394.6 A 158 158 0 0 1 614.2 670.5 A 24 24 0 0 1 577.9 664.2 L 515.2 555.6 A 24 24 0 0 1 512.0 543.6 Z"/>
  </g>
</svg>
