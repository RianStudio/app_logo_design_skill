<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Rian app icon template (minimal line style). Copy this file and change only the parts marked TODO.
    Example: Tide, a focus timer: an ink stopwatch with 25 of 60 minutes filled in coral.
    Every number (keylines, gaps, accent share) lives in references/style.md. Layers, attributes and variants:
    references/construction.md. Check with python3 scripts/render.py icon.svg -o renders plus the variants flag
    (one metrics line per rule, PASS / FAIL / INFO). Never put two hyphens in a row inside a comment: the SVG stops loading.
  -->
  <defs>
    <!-- bg: light #FFFFFF → #EEEEEB. Draw the light version only; render.py makes dark and tinted (variants flag). -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEB"/>
    </linearGradient>
    <!-- TODO accent: ONE colour from the palette, light → main.
         Fixed span: 480 px after scaling = 480 ÷ k in source units, centred on the accent shape's vertical centre.
         Here k = 1.08, span 444; the sector runs y 299..755 (centre 527), so y1 305, y2 749. -->
    <linearGradient id="accent" x1="0" y1="305" x2="0" y2="749" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9C86"/>
      <stop offset="1" stop-color="#EC5B45"/>
    </linearGradient>
    <!-- lift: one faint shadow under the whole subject (light .10; the dark variant uses .35, tinted and favicon drop it) -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="16" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".10"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- TODO transform: translate(512 512) scale(k) translate(-512 -512) translate(tx ty) puts the subject on its keyline.
       TODO data-shape: circle | square | tall | wide, or open for open / composite shapes (viewfinder, brackets,
       a body with separate outer parts). It picks the size check: silhouette vs Tide, or convex hull vs Tide.
       Here: case outer diameter (250 + 24) × 2 × 1.08 = 592 (circle keyline); case centre (512, 527);
       crown top 153 → 100.5 px after scaling, inside the safe area; long side 723. -->
  <g id="subject" data-shape="circle" transform="translate(512 512) scale(1.08) translate(-512 -512) translate(0 -22)" filter="url(#lift)">
    <!-- TODO backing: the FIRST child, same shape as the outer outline (on the line's centre line), fill url(#bg).
         It keeps the lift shadow outside the outline. Leave it out only when nothing enclosed is left blank:
         bare brackets (QR), or closed areas already filled by the accent and a knock-out fill (Halo). -->
    <circle id="backing" cx="512" cy="548" r="250" fill="url(#bg)"/>
    <!-- TODO accent shape: one closed shape, under the lines. Its edge sits on a line's centre line, or keeps the
         accent clearance from every line (free edges: straight or a full arc, both ends on a line's centre line).
         A line-like accent (a scan beam) adds data-accent="line" here.
         Example: 25 of 60 minutes = 150° sector from 12 o'clock, r 250, corners rounded 24; its rim sits on the case's
         centre line, the two radii are free edges ending on it.
         (python3 scripts/shapes.py sector 512 548 250 -90 60 24) -->
    <path id="accent-shape" fill="url(#accent)"
          d="M 512.0 541.6 L 512.0 323.3 A 24.0 24.0 0 0 1 538.5 299.4 A 250.0 250.0 0 0 1 659.3 750.0 A 24.0 24.0 0 0 1 624.4 742.6 L 515.2 553.6 A 24.0 24.0 0 0 1 512.0 541.6 Z"/>
    <!-- TODO lines: one stroke width, 52 after scaling = 52 ÷ k before (here 52 ÷ 1.08 ≈ 48); round caps and joins.
         Never set a stroke width or colour on a single line; render.py swaps colours for the variants.
         Marks on single lines:
           class="on-accent"  a line lying inside the accent: kept clear of the accent edge, stays #1C1C1E in dark
           class="detail"     an inner detail dropped in the favicon and small sizes
           data-part="split"  both parts of one object cut apart (exploded pie slice): the smaller split gap applies
         A closed line shape that must hide the accent (a cloud over a sun) gets the knock-out fill #FFFFFF
         instead of none; render.py turns it into #3A3A3D (dark) or a mask (tinted). -->
    <g id="line" fill="none" stroke="#1C1C1E" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
      <!-- case: circle r 250 at (512, 548) -->
      <circle cx="512" cy="548" r="250"/>
      <!-- crown: stem from the case up to the cap's centre line y 177, cap 120 wide.
           Cap bottom edge 201, case top edge 274: (274 - 201) × 1.08 = 78.8 clear, though a T-junction would not count -->
      <path d="M 512 272 V 177 M 452 177 H 572"/>
    </g>
  </g>
</svg>
