<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Rian app icon template. Copy this file and replace only the parts marked TODO.
    Layers: background -> solid (saturated, behind) -> glass (frosted, in front).
    Keep the same translate on #glyph and #glass, and its inverse on the <use href="#scene">.
  -->
  <defs>
    <!-- TODO background: one hue, top 10-18% lighter than bottom -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6DB6FF"/><stop offset="1" stop-color="#2A74E6"/>
    </linearGradient>
    <!-- TODO solid colour: the accent hue, top lighter than bottom -->
    <linearGradient id="solid" x1="0" y1="260" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#FFB41F"/>
    </linearGradient>
    <radialGradient id="lift" cx="512" cy="0" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- TODO set both flood-color values to the background hue's darkest tone -->
    <!-- two-part elevation shadow (Material): wide ambient + tight key, tinted with the hue's dark tone -->
    <filter id="elevate" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="a"/>
      <feOffset in="a" dy="20" result="a"/>
      <feFlood flood-color="#0B3A8F" flood-opacity=".30"/>
      <feComposite in2="a" operator="in" result="ambient"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="k"/>
      <feOffset in="k" dy="4" result="k"/>
      <feFlood flood-color="#0B3A8F" flood-opacity=".20"/>
      <feComposite in2="k" operator="in" result="key"/>
      <feMerge><feMergeNode in="ambient"/><feMergeNode in="key"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="18"/></filter>
    <!-- TODO glass shape: ONE closed outline (no overlapping sub-shapes, or the veil doubles) -->
    <path id="glass-shape" d="M 420 700 A 90 90 0 0 1 420 520 L 472 520 A 130 130 0 0 1 728 520 L 700 520 A 90 90 0 0 1 700 700 Z"/>
    <clipPath id="glass-clip"><use href="#glass-shape"/></clipPath>
  </defs>
  <g id="scene">
    <g id="background">
      <rect width="1024" height="1024" fill="url(#bg)"/>
      <rect width="1024" height="1024" fill="url(#lift)"/>
    </g>
    <g id="glyph" transform="translate(-18 32)" filter="url(#elevate)">
      <!-- TODO solid shape -->
      <circle cx="440" cy="430" r="170" fill="url(#solid)"/>
    </g>
  </g>
  <!-- frosted glass: opaque base casts the shadow, the scene behind is blurred inside it, a tinted veil lightens it, a rim catches the light -->
  <g id="glass" transform="translate(-18 32)">
    <use href="#glass-shape" fill="#fff" filter="url(#elevate)"/>
    <g clip-path="url(#glass-clip)">
      <use href="#scene" transform="translate(18 -32)" filter="url(#frost)"/>
      <use href="#glass-shape" fill="#F2F8FF" fill-opacity=".42"/>
    </g>
    <use href="#glass-shape" fill="none" stroke="url(#rim)" stroke-width="8" clip-path="url(#glass-clip)"/>
  </g>
</svg>
