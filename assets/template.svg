<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Rian app icon template (line style). Copy this file and change only the parts marked TODO.
    Example: Tide, a focus timer: an ink stopwatch with 25 of 60 minutes filled in coral.
    Rules: references/style.md. Recipe and platform specs: references/construction.md.
  -->
  <defs>
    <!-- TODO bg: light (default) #FFFFFF → #EEEEEB; dark #3A3A3D → #1C1C1E -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEB"/>
    </linearGradient>
    <!-- TODO accent: ONE colour from the palette, light → main; y1/y2 = the accent shape's top and bottom -->
    <linearGradient id="accent" x1="0" y1="300" x2="0" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9C86"/>
      <stop offset="1" stop-color="#EC5B45"/>
    </linearGradient>
    <!-- lift: one faint shadow under the whole subject. TODO flood-opacity: light .10, dark .35 -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="16" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".10"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- TODO transform: scale k so the subject's long side (with stroke) is about 680 px; ty for optical centring -->
  <g id="subject" transform="translate(512 512) scale(1.08) translate(-512 -512) translate(0 -24)" filter="url(#lift)">
    <!-- TODO accent shape: one closed shape, under the lines.
         Example: 25 of 60 minutes = 150° sector from 12 o'clock, r 250, corners rounded 24
         (python3 scripts/shapes.py sector 512 548 250 -90 60 24) -->
    <path id="accent-shape" fill="url(#accent)"
          d="M 512.0 541.6 L 512.0 323.3 A 24.0 24.0 0 0 1 538.5 299.4 A 250.0 250.0 0 0 1 659.3 750.0 A 24.0 24.0 0 0 1 624.4 742.6 L 515.2 553.6 A 24.0 24.0 0 0 1 512.0 541.6 Z"/>
    <!-- TODO lines: one stroke width, 52 after scaling = 52 ÷ k before (here 52 ÷ 1.08 ≈ 48); round caps and joins. Dark version: stroke #F5F5F7.
         A closed line shape that must hide the accent gets fill="#FFFFFF" (dark: #2A2A2C) instead of none. -->
    <g id="line" fill="none" stroke="#1C1C1E" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
      <!-- case: circle r 250 at (512, 548) -->
      <circle cx="512" cy="548" r="250"/>
      <!-- crown: stem from the case to y 214, cap 120 wide at y 196 -->
      <path d="M 512 272 V 214 M 452 196 H 572"/>
    </g>
  </g>
</svg>
