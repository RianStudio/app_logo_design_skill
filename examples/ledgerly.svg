<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Ledgerly, a bookkeeping app: log every expense and see at month end where the money went.
    The month's spending as a pie chart drawn in one line (a 288° arc and two radii); the missing 72° slice is
    pulled out to the upper right and filled green: "this is where the money went".
    Drawn at final size: k = 1, every coordinate is a 1024-canvas pixel before translate.
    Rules and numbers: references/style.md. Layers, attributes and variants: references/construction.md.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26282B"/>
      <stop offset="1" stop-color="#191C1F"/>
    </linearGradient>
    <linearGradient id="body-fill" x1="0" y1="240" x2="0" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#C6C8CB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="32" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FD3A6"/>
      <stop offset="1" stop-color="#23A36B"/>
    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>
  <!-- transform: k = 1, then (−5, −5): silhouette centroid on the centre.
       The slice is pulled out 165 along −54° (its bisector): its straight edges then run 165 × sin 36° = 97 from
       the pie's radii, so 97 − 30 = 67 clear of their edge (≥ 60). Slice R 262 against the pie's 250.
       render.py: 1 line, accent 14.1 % of the hull, silhouette 0.98 × Tide. data-category finance: green. -->
  <g id="subject" data-shape="circle" data-category="finance" transform="translate(512 512) scale(1) translate(-512 -512) translate(-5 -5)">
    <!-- volume: the pie's inside: the 288° sector the line draws, filled; the pulled-out slice stays outside. Flat white at .14 (Apple HIG: filled, overlapping layers at different
         opacities; the system adds the light). No glow: iOS 26 adds shadow and specular highlights itself -->
    <path id="volume" fill="#FFFFFF" fill-opacity="0.14" d="M 500.0 540.0 L 737.8 462.7 A 250 250 0 1 1 500.0 290.0 Z"/>
    <!-- the line drawing: centre lines only, stroke 60, round caps and joins, no fill -->
    <!-- pie: centre (500, 540), r 250, open from −90° to −18° -->
    <g id="body" fill="none" stroke="url(#body-fill)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 500.0 540.0 L 737.8 462.7 A 250 250 0 1 1 500.0 290.0 Z"/>
    </g>
    <!-- accent shape: python3 scripts/shapes.py sector 597 373.5 262 -90 -18 24 -->
    <path id="accent-shape" fill="url(#accent)" d="M 597.0 373.5 L 597.0 169.7 A 24 24 0 0 1 623.4 145.8 A 262 262 0 0 1 836.7 300.8 A 24 24 0 0 1 822.2 333.3 L 628.4 396.3 A 24 24 0 0 1 597.0 373.5 Z"/>
  </g>
</svg>
