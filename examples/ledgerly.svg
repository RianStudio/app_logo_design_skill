<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Rian app icon (line style), built from assets/template.svg.
    Ledgerly, a bookkeeping app: log one expense a day and see at month end where the money went.
    The month's spending as a pie chart; the biggest category, 40 % of the pie (144°), is pulled out
    and filled green: "this is where the money went".
  -->
  <defs>
    <!-- bg: light #FFFFFF → #EEEEEB -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEB"/>
    </linearGradient>
    <!-- accent: green #6FD3A6 → #23A36B; y1/y2 = the accent shape's top (198) and bottom (549) -->
    <linearGradient id="accent" x1="0" y1="198" x2="0" y2="549" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FD3A6"/>
      <stop offset="1" stop-color="#23A36B"/>
    </linearGradient>
    <!-- lift: one faint shadow under the whole subject (light .10) -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="16" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".10"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- transform: drawn at final size, k = 1, no offset. Pie centre (466, 563), R 263.
       The slice (-120° → 24°, bisector -48°) is pulled out by (92, -102) ≈ 137 px along its bisector,
       so each of its straight edges runs 130.7 / 130.6 px (centre to centre) from the matching body edge:
       a clear gap of 78 px between the 52 px strokes.
       Outline incl. stroke: x 177..847 (670), y 172..852 (680), bounding box centred on (512, 512). -->
  <g id="subject" transform="translate(512 512) scale(1) translate(-512 -512) translate(0 0)" filter="url(#lift)">
    <!-- accent shape: the pulled-out 40 %, -120° → 24° sector, r 263, all corners rounded 52
         (python3 scripts/shapes.py sector 558 461 263 -120 24 52); its edges sit on the slice outline's
         centre line, so the visible green has inner corners of 52 - 26 = 26 px. -->
    <path id="accent-shape" fill="url(#accent)"
          d="M 549.6 446.4 L 455.8 283.9 A 52.0 52.0 0 0 1 486.7 207.9 A 263.0 263.0 0 0 1 817.2 505.5 A 52.0 52.0 0 0 1 744.8 544.2 L 573.4 467.9 A 52.0 52.0 0 0 1 549.6 446.4 Z"/>
    <!-- lines: one stroke width 52 (k = 1 → 52/1); round caps and joins -->
    <g id="line" fill="none" stroke="#1C1C1E" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
      <!-- pie body: the other 60 %, 24° → 240° sector at (466, 563), r 263, rim corners rounded 52;
           the inner (reflex) corner rounded by a radius-52 concave arc centred in the notch
           (tangent points 16.9 px from the centre = 52 / tan 72°), so the stroke's notch side is r 26 -->
      <path d="M 481.4 569.9 L 652.8 646.2 A 52 52 0 0 1 672.5 725.9 A 263 263 0 1 1 282.4 374.7 A 52 52 0 0 1 363.8 385.9 L 457.6 548.4 A 52 52 0 0 0 481.4 569.9 Z"/>
      <!-- slice outline: same path as the accent -->
      <path d="M 549.6 446.4 L 455.8 283.9 A 52.0 52.0 0 0 1 486.7 207.9 A 263.0 263.0 0 0 1 817.2 505.5 A 52.0 52.0 0 0 1 744.8 544.2 L 573.4 467.9 A 52.0 52.0 0 0 1 549.6 446.4 Z"/>
    </g>
  </g>
</svg>
