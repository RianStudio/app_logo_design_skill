<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    QR Code Scanner, line style (Rian app icon). Point the camera at a QR code or barcode and open it instantly.
    Four rounded viewfinder brackets around a simplified QR code (three solid finder blocks in an L, the
    bottom-right cell left empty as on a real code); a wide blue scan beam sweeps across the middle.
    Rules: references/style.md. Recipe and platform specs: references/construction.md.
  -->
  <defs>
    <!-- bg: light #FFFFFF → #EEEEEB -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEB"/>
    </linearGradient>
    <!-- accent: blue, light → main; y1/y2 = the scan beam's top and bottom (442 / 582) -->
    <linearGradient id="accent" x1="0" y1="442" x2="0" y2="582" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7AAEFF"/>
      <stop offset="1" stop-color="#3B7BEA"/>
    </linearGradient>
    <!-- lift: one faint shadow under the whole subject (light .10) -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="16" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".10"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- transform: drawn at final size, so k = 1 and no offset (the subject is symmetric about (512, 512)).
       Outer long side = 628 centreline + 52 stroke = 680 px (172..852), the ~680 target.
       Exception noted: style.md suggests ~600 for square subjects. This one cannot go smaller without breaking a
       hard rule: code box 420 (96 block + 44 + 140 beam + 44 + 96) + 2 × 78 clearance + 2 × 26 half-stroke = 628. -->
  <g id="subject" transform="translate(512 512) scale(1) translate(-512 -512) translate(0 0)" filter="url(#lift)">
    <!-- accent: the scan beam. Capsule 524 × 140 centred on (512, 512): x 250..774, y 442..582, rx 70.
         Ends sit 26 (half a stroke) inside the bracket inner edge 224 / 800, so the whole shape lies inside the
         viewfinder; the rounded ends clear the bracket arm caps by 78. 44 clear of the finder blocks above and below.
         Area 524·140 − (4 − π)·70² ≈ 69.2k px² = 15.0 % of the 680² bounding box, 15.6 % of the rounded footprint. -->
    <rect id="accent-shape" x="250" y="442" width="524" height="140" rx="70" fill="url(#accent)"/>
    <!-- lines: one stroke width, 52 ÷ k = 52; round caps and joins. 7 ink pieces: 4 brackets + 3 blocks. -->
    <g id="line" fill="none" stroke="#1C1C1E" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
      <!-- viewfinder: four corners of a centreline square 198..826 (628), corner radius 126 (20 %).
           Each arm reaches 190 from its corner (to 388 / 636): 248 between arm ends, 196 clear. Inner edge 224 / 800. -->
      <path d="M 198 388 V 324 A 126 126 0 0 1 324 198 H 388"/>
      <path d="M 636 198 H 700 A 126 126 0 0 1 826 324 V 388"/>
      <path d="M 826 636 V 700 A 126 126 0 0 1 700 826 H 636"/>
      <path d="M 388 826 H 324 A 126 126 0 0 1 198 700 V 636"/>
      <!-- code: box 302..722 (420) = bracket inner edge 224 + 78 clear, so every block is 78 from the brackets
           (about 84 on the corner diagonal). Finder blocks: centreline 44 square, rx 10 (23 %), stroke 52 →
           solid 96 square with a 36 outer radius and no enclosed cell. Outer edges 302..398 and 626..722 (228 apart).
           fill = ink colour only closes the degenerate centre of the stroke (Chromium leaves a pinhole);
           in the dark or tinted version change it together with the stroke. -->
      <rect x="328" y="328" width="44" height="44" rx="10" fill="#1C1C1E"/>
      <rect x="652" y="328" width="44" height="44" rx="10" fill="#1C1C1E"/>
      <rect x="328" y="652" width="44" height="44" rx="10" fill="#1C1C1E"/>
    </g>
  </g>
</svg>
