<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    QR Code Scanner, line style (Rian app icon). Point the camera at a QR code or barcode and open it instantly.
    Four rounded viewfinder brackets around a simplified QR code (three solid finder blocks in an L, the
    bottom-right cell left empty as on a real code); a thin blue scan beam crosses the whole frame.
    Rules: references/style.md. Layers, marks and variants: references/construction.md.
    Variants (dark, tinted, favicon) come from python3 scripts/render.py examples/qr-scanner.svg plus the variants flag.
  -->
  <defs>
    <!-- bg: light #FFFFFF → #EEEEEB -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEB"/>
    </linearGradient>
    <!-- accent: blue (扫码), light → main. Fixed span 480 px (k = 1, so 480 in source units),
         centred on the beam's vertical centre y 512: y1 = 512 - 240 = 272, y2 = 512 + 240 = 752 -->
    <linearGradient id="accent" x1="0" y1="272" x2="0" y2="752" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7AAEFF"/>
      <stop offset="1" stop-color="#3B7BEA"/>
    </linearGradient>
    <!-- lift: one faint shadow under the whole subject (light .10) -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="16" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".10"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- k = 1, no offset: drawn at final size, symmetric about (512, 512).
       data-shape open: four separate brackets, so the size check is the convex hull vs Tide (0.90 to 1.15).
       Frame outer box 214..810 (596) = square keyline 540 + 10 % for an open shape; with the beam ends 644 wide.
       The frame cannot grow: code box 344..680 (336) = 2 × 90 block + 2 × 42 + 72 beam, plus 2 × 78 clearance
       and 2 × 26 half stroke = 544 centre line. A larger frame pushes the hull past 1.15 × Tide.
       No #backing: the brackets enclose nothing, so the lift shadow already falls only outside the lines.
       render.py: hull 1.13 × Tide, beam 13 % of the hull, centroid 10 px off centre, r_max 364
       (export scales Android by 313 / 364 = 0.86 and the PWA maskable icon by 409.6 / 364 = 1.13). -->
  <g id="subject" data-shape="open" transform="translate(512 512) scale(1) translate(-512 -512) translate(0 0)" filter="url(#lift)">
    <!-- accent: the scan beam, a line-like accent (data-accent line: 8 to 15 % of the hull).
         Capsule 644 × 72 centred on (512, 512): x 190..834, y 476..548, rx 36.
         It passes through the side openings of the viewfinder and ends 24 past the frame's outer edge 214 / 810.
         Every edge is free: 42 clear of the finder blocks above and below, 54 clear of the bracket arm caps. -->
    <rect id="accent-shape" data-accent="line" x="190" y="476" width="644" height="72" rx="36" fill="url(#accent)"/>
    <!-- lines: one stroke width, 52 (k = 1); round caps and joins. color sets the ink for the solid blocks,
         so the dark and tinted variants recolour stroke and blocks together. 7 ink pieces: 4 brackets + 3 blocks. -->
    <g id="line" fill="none" stroke="#1C1C1E" color="#1C1C1E" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
      <!-- viewfinder: four corners of a centre line square 240..784 (544), corner radius 112 (20.6 %).
           Each arc ends 352 / 672; the arm runs on 44 to 396 / 628 (116 from the centre), so the arm caps sit
           54 clear of the beam and 180 clear of each other. Inner edge 266 / 758. -->
      <path d="M 240 396 V 352 A 112 112 0 0 1 352 240 H 396"/>
      <path d="M 628 240 H 672 A 112 112 0 0 1 784 352 V 396"/>
      <path d="M 784 628 V 672 A 112 112 0 0 1 672 784 H 628"/>
      <path d="M 396 784 H 352 A 112 112 0 0 1 240 672 V 628"/>
      <!-- code: finder blocks, solid 90 squares, rx 24, no stroke (a solid block up to 2 × stroke counts as a line).
           Outer edges 344 / 680 = bracket inner edge 266 + 78 clear. Corner radius 24 keeps 78 on the diagonal too:
           block corner centre (368, 368), arc centre (352, 352), arc inner radius 86.
           Inner detail (class detail): dropped in the favicon, which keeps only the viewfinder and the beam. -->
      <rect class="detail" x="344" y="344" width="90" height="90" rx="24" fill="currentColor" stroke="none"/>
      <rect class="detail" x="590" y="344" width="90" height="90" rx="24" fill="currentColor" stroke="none"/>
      <rect class="detail" x="344" y="590" width="90" height="90" rx="24" fill="currentColor" stroke="none"/>
    </g>
  </g>
</svg>
