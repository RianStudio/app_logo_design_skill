<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Streak, a daily habit check-in app: an ink calendar page crossed by a green run of days. The run comes in from
    under the page's left edge (the streak began before this page) and ends in a round cap: today, ticked off.
    Built from assets/template.svg (line style). k = 1: drawn at final size, stroke 52.
    Variants (dark, tinted, favicon) come from python3 scripts/render.py examples/streak.svg plus the variants flag.
  -->
  <defs>
    <!-- bg: light #FFFFFF → #EEEEEB -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEB"/>
    </linearGradient>
    <!-- accent: green (完成), light → main. Fixed span 480 (k = 1), centred on the run's vertical centre y 530:
         y1 290, y2 770 -->
    <linearGradient id="accent" x1="0" y1="290" x2="0" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FD3A6"/>
      <stop offset="1" stop-color="#23A36B"/>
    </linearGradient>
    <!-- lift: light .10 -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="16" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".10"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- k = 1. data-shape square: the page is the body, the binder rings are a top protrusion.
       Page centre line x 248..776, y 286..774; outer box x 222..802, y 260..800 (580 × 540, the square keyline);
       ring tops at 200 (60 above the page), inside the safe area. Body centre (512, 530), the body-centre line
       for a top protrusion. render.py: silhouette 1.06 × Tide, accent 24 % of the hull, r_max 356. -->
  <g id="subject" data-shape="square" transform="translate(512 512) scale(1) translate(-512 -512) translate(0 0)" filter="url(#lift)">
    <!-- backing: same rounded rect as the page outline, on its centre line; keeps the lift shadow outside the page -->
    <rect id="backing" x="248" y="286" width="528" height="488" rx="100" fill="url(#bg)"/>
    <!-- accent shape: the streak, a run of days 224 tall (y 418..642, centred on the page at 530).
         Left edge: straight, on the page's left centre line x 248 and inside the side's straight part (y 386..674),
         so both of its corners sit under the line. Top, bottom and the round right end (r 112, centre (572, 530),
         end x 684) are one free edge of two straight lines and a whole half circle, both ends on the left centre line.
         Clear of the lines: top 418 to the ring ends' outer edge 362 = 56; bottom 642 to the inner edge 748 = 106;
         right end 684 to the inner edge 750 = 66. Visible green x 274..684. -->
    <path id="accent-shape" fill="url(#accent)" d="M 248 418 H 572 A 112 112 0 0 1 572 642 H 248 Z"/>
    <g id="line" fill="none" stroke="#1C1C1E" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
      <!-- page: 528 × 488 at (248, 286), rx 100 (≥ 20 % of the short side 488 = 97.6, on the centre line) -->
      <rect x="248" y="286" width="528" height="488" rx="100"/>
      <!-- binder rings: two stubs at x = 512 ± 144, from y 226 (above the page) to 336 (inside); they cross the
           page's top line at 90°, so they are connected lines. Inner detail: dropped in the favicon. -->
      <path class="detail" d="M 368 226 V 336 M 656 226 V 336"/>
      <!-- tick: today, set in the run's round end, not in the middle of the page, so the green to its left reads
           as the days before (on-accent: stays #1C1C1E in the dark variant).
           Short arm 40 × 40 into the vertex (544, 570), long arm 64 × 64 up to (608, 506). With its stroke the tick
           spans x 478..634 (centre 556, within 20 of the round end's centre 572); the green left of it, x 274..478,
           is the run so far. Clear of the run's edge (stroke edge 26 from the centre line):
           vertex bottom 596 to the bottom edge 642 = 46 px; start (504, 530) top 504 to 418 = 86 px;
           the end (608, 506) is 43.3 from the round end's centre (572, 530) → 112 − 43.3 − 26 = 42.7 px. -->
      <path class="on-accent" d="M 504 530 L 544 570 L 608 506"/>
    </g>
  </g>
</svg>
