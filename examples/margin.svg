<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Margin, a notes app: quick notes and longer writing.
    Final: an ink sheet of paper (portrait, tall keyline) whose left margin is filled yellow
    (the app's name, and where notes start); three lines of writing sit at the top, open paper below for longer writing.
    Rules: references/style.md. Layers, attributes and variants: references/construction.md.
    Variants (dark, tinted, favicon) come from python3 scripts/render.py examples/margin.svg plus the variants flag.
  -->
  <defs>
    <!-- bg: light #FFFFFF → #EEEEEB -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEB"/>
    </linearGradient>
    <!-- accent: yellow (笔记), light → main. Fixed span 480 px (k = 1, so 480 in source units),
         centred on the margin strip's vertical centre: strip y 222..802, centre 512, so y1 272, y2 752 -->
    <linearGradient id="accent" x1="0" y1="272" x2="0" y2="752" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#F2AE2E"/>
    </linearGradient>
    <!-- lift: one faint shadow under the whole subject (light .10) -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="16" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".10"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- k = 1: drawn at final size, stroke 52. data-shape tall: a solid portrait page.
       Page outer box (with stroke) 508 × 632 (x 258..766, y 196..828), centred on (512, 512); aspect 0.80 like the
       tall keyline 480 × 600, a little larger so the writing lines can be long.
       render.py: silhouette 1.07 × Tide, accent 16.4 % of the hull, r_max 357. -->
  <g id="subject" data-shape="tall" transform="translate(512 512) scale(1) translate(-512 -512) translate(0 0)" filter="url(#lift)">
    <!-- backing: same rounded rect as the page outline, on its centre line; keeps the lift shadow outside the page -->
    <rect id="backing" x="284" y="222" width="456" height="580" rx="96" fill="url(#bg)"/>
    <!-- accent shape: the margin strip. Left, top and bottom edges sit on the page centreline (x 284, y 222 / 802,
         corners rx 96 = the page's); the right edge at x 410 is a free edge, a straight line with both ends on the
         page's centre line (like Tide's sector radii).
         Visible yellow 100 × 528 (page inner edge x 310 to 410, y 248..776). -->
    <path id="accent-shape" fill="url(#accent)"
          d="M 410 222 H 380 A 96 96 0 0 0 284 318 V 706 A 96 96 0 0 0 380 802 H 410 Z"/>
    <!-- lines: one stroke width 52 (k = 1); round caps and joins -->
    <g id="line" fill="none" stroke="#1C1C1E" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
      <!-- page: centreline rect x 284..740, y 222..802 (456 × 580), rx 96 = 21 % of 456 -->
      <rect x="284" y="222" width="456" height="580" rx="96"/>
      <!-- writing: three lines at y 362 / 492 / 622 (130 apart = 78 clear). Centrelines x 492..610, caps x 466..636
           (170 long, so they read as writing, not as pills). The last line is short (to x 550, 110 long), a paragraph ending.
           Caps 56 clear of the yellow edge (x 410; at least 40, and writing starts close to the margin) and
           78 clear of the page's inner right edge (x 714). Top cap 88 below the inner top edge (248),
           128 of open paper below (648 to 776). Inner detail: dropped in the favicon and small sizes. -->
      <path class="detail" d="M 492 362 H 610 M 492 492 H 610 M 492 622 H 550"/>
    </g>
  </g>
</svg>
