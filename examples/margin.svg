<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Margin, a notes app: quick notes and longer writing.
    Final: an ink sheet of paper (portrait, Google-keyline-like 0.77 ratio) whose left margin is filled yellow
    (the app's name, and where notes start); three lines of writing sit at the top, open paper below for longer writing.
    Rules: references/style.md. Recipe and platform specs: references/construction.md.
  -->
  <defs>
    <!-- bg: light #FFFFFF → #EEEEEB -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEB"/>
    </linearGradient>
    <!-- accent: yellow #FFD978 → #F2AE2E; y1/y2 = the margin strip's top (218) and bottom (806) -->
    <linearGradient id="accent" x1="0" y1="218" x2="0" y2="806" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#F2AE2E"/>
    </linearGradient>
    <!-- lift: one faint shadow under the whole subject (light .10) -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="16" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".10"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- transform: drawn at final size, k = 1. Page outer box (with stroke) 492 × 640 (x 266–758, y 192–832), centred on (512, 512) -->
  <g id="subject" transform="translate(512 512) scale(1) translate(-512 -512) translate(0 0)" filter="url(#lift)">
    <!-- accent shape: the margin strip. Left, top and bottom edges sit on the page centreline (x 292, y 218 / 806,
         corners rx 90 = the page's); the right edge at x 418 is free inside the page, like Tide's sector edges.
         Visible yellow 100 × 536 (inner edges x 318–418, y 244–780), about 26 % of the inner width, ≈ 17 % of the silhouette -->
    <path id="accent-shape" fill="url(#accent)"
          d="M 418 218 H 382 A 90 90 0 0 0 292 308 V 716 A 90 90 0 0 0 382 806 H 418 Z"/>
    <!-- lines: one stroke width 52 (k = 1); round caps and joins -->
    <g id="line" fill="none" stroke="#1C1C1E" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
      <!-- page: centreline rect x 292–732, y 218–806 (440 × 588), rx 90 = 20.5 % of 440 -->
      <rect x="292" y="218" width="440" height="588" rx="90"/>
      <!-- writing: three lines at y 360 / 490 / 620 (130 apart = 78 clear), centrelines x 522–602:
           caps x 496–628 sit 78 clear of the yellow edge (418) and of the page's inner right edge (706),
           so the text block is centred in the white part of the page. Top cap 90 clear of the inner top edge (244),
           134 of open paper below. The last line is short (to x 562), a paragraph ending. -->
      <path d="M 522 360 H 602 M 522 490 H 602 M 522 620 H 562"/>
    </g>
  </g>
</svg>
