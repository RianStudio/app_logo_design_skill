<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DBBFF"/>
      <stop offset="1" stop-color="#2F7FF0"/>
    </linearGradient>
    <radialGradient id="lift" cx="512" cy="0" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="330" x2="0" y2="694" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D3E5FF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="18"/>
      <feFlood flood-color="#0A3A8C" flood-opacity=".28"/>
      <feComposite operator="in" in2="SourceAlpha"/>
      <feComposite operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#lift)"/>
  </g>
  <g id="glyph">
    <!-- halo: a broken ring, the gap faces the light source (top-right) -->
    <path d="M 710 314 A 280 280 0 1 0 792 512" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="28" stroke-linecap="round"/>
    <circle cx="512" cy="512" r="182" fill="url(#disc)" filter="url(#soft)"/>
    <ellipse cx="512" cy="378" rx="104" ry="34" fill="#fff" opacity=".9"/>
  </g>
</svg>
