<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Tide, a focus timer: a stopwatch. The coral sector is 25 of 60 minutes; ring, stem and crown are one line.
    Same geometry as assets/template.svg, and the size reference for the set: render.py measures every other
    icon's silhouette and convex hull against this file (and falls back to its built-in Tide numbers,
    silhouette 261 400 px², hull 286 500 px², r_max 401, when this file is missing).
    Graphite line style: one connected line drawing (ring, stem, crown), 60 px wide with round caps and joins,
    plus one filled coral sector 60 clear of the ring. Drawn at final size: k = 1, every coordinate is a
    1024-canvas pixel before translate.
    Rules and numbers: references/style.md. Layers, attributes and variants: references/construction.md.
  -->
  <defs>
    <!-- bg: graphite, fixed (#26282B → #191C1F). Only the default look is drawn; render.py makes light, dark, mono, small -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26282B"/>
      <stop offset="1" stop-color="#191C1F"/>
    </linearGradient>
    <!-- body-fill: top light, fixed colours #F8F9FB → #C6C8CB, the stroke of every line.
         Span 600 (k = 1) centred on the drawn lines' vertical range: crown top y 136 (166 − 30) to ring bottom
         830 (550 + 250 + 30), centre 483, so y1 183, y2 783 -->
    <linearGradient id="body-fill" x1="0" y1="183" x2="0" y2="783" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#C6C8CB"/>
    </linearGradient>
    <!-- accent: coral (timer, focus), light #FF9C86 → main #EC5B45.
         Span 480 centred on the sector: y 394..676 (centre 535), so y1 295, y2 775 -->
    <linearGradient id="accent" x1="0" y1="295" x2="0" y2="775" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9C86"/>
      <stop offset="1" stop-color="#EC5B45"/>
    </linearGradient>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- transform: k = 1, then up 20: the ring centre (512, 550) lands on (512, 530).
       Circle keyline 600: the ring's outer diameter is 2 × (250 + 30) = 560. Outer box x 232..792, y 116..810
       (crown top to ring bottom): 560 × 694, long side 694 ≤ 720.
       render.py: 1 line, accent 61.8 px clear of the ring, 11.3 % of the hull, silhouette centroid 3 px off
       centre, r_max 401 (Android ×0.723 and PWA ×1.022: the caps every other icon shares come from here).
       Tide is the size reference: silhouette, hull and ink 1.00. -->
  <g id="subject" data-shape="circle" transform="translate(512 512) scale(1) translate(-512 -512) translate(0 -20)">
    <!-- volume: the ring's inside: the same circle as the ring's centre line, so its edge hides under the line; the sector lies on it. Flat white at .14 (Apple HIG: filled, overlapping layers at different
         opacities; the system adds the light). No glow: iOS 26 adds shadow and specular highlights itself -->
    <circle id="volume" cx="512" cy="550" r="250" fill="#FFFFFF" fill-opacity="0.14"/>
    <!-- the line drawing: centre lines only, stroke 60 (= 60 / k), round caps and joins, no fill -->
    <g id="body" fill="none" stroke="url(#body-fill)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
      <!-- ring: centre line r 250, so the stroke runs from r 220 to r 280 -->
      <circle cx="512" cy="550" r="250"/>
      <!-- crown 120 wide on a stem that meets the ring top (y 300) at a right angle: one connected line -->
      <path d="M 452 166 H 572 M 512 166 V 300"/>
    </g>
    <!-- accent shape: 25 of 60 minutes = 150°, from 12 o'clock (−90°) clockwise to 60°, R 158, corners 24.
         The ring's inner edge is r 220, so 220 − 158 = 62 clear (≥ 60, one line width).
         python3 scripts/shapes.py sector 512 550 158 -90 60 24 -->
    <path id="accent-shape" fill="url(#accent)" d="M 512.0 543.6 L 512.0 418.2 A 24 24 0 0 1 540.3 394.6 A 158 158 0 0 1 614.2 670.5 A 24 24 0 0 1 577.9 664.2 L 515.2 555.6 A 24 24 0 0 1 512.0 543.6 Z"/>
  </g>
</svg>
