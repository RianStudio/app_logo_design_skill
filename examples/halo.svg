<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Halo, a weather app: today's forecast at a glance. Partly sunny: a yellow sun behind an ink cloud;
    the cloud is ONE closed line shape filled with the background white, so it hides the sun's lower left.
    Drawn at final size: k = 1, every coordinate below is a 1024-canvas pixel, stroke 52.
    Rules: references/style.md. Recipe and platform specs: references/construction.md.
  -->
  <defs>
    <!-- bg: light (default) #FFFFFF → #EEEEEB -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEB"/>
    </linearGradient>
    <!-- accent: yellow (weather), light #FFD978 → main #F2AE2E; y1/y2 = top and bottom of the sun disc (426 ∓ 191) -->
    <linearGradient id="accent" x1="0" y1="235" x2="0" y2="617" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#F2AE2E"/>
    </linearGradient>
    <!-- lift: one faint shadow under the whole subject (light version: flood-opacity .10) -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="16" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".10"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- transform: k = 1 (drawn at final size), no translate; centre-line bbox x 183..811, y 235..764
       -> outer 680 x 581 px (x 157..837, y 209..790).
       Placement: the bbox centred on (512, 512) would leave the mass centroid at about (544, 546), lower right,
       because the sun ring and the right lobe stack two arcs on the right and the flat base is heavy.
       The subject is moved (-15, -12) px, half way toward that centroid: margins L 157 / R 187, T 209 / B 234
       (each pair within 30 px), silhouette centroid (529, 535), ink centroid (529, 532). -->
  <g id="subject" transform="translate(512 512) scale(1) translate(-512 -512) translate(0 0)" filter="url(#lift)">
    <!-- accent shape: the sun disc, r 191 at (620, 426); its edge sits on the sun line's centre line.
         The cloud's white fill hides its lower left; 72% of the disc stays visible and the yellow is 22.5% of the subject. -->
    <circle id="accent-shape" fill="url(#accent)" cx="620" cy="426" r="191"/>
    <!-- lines: one stroke width, 52 after scaling = 52 ÷ k before (k = 1, so 52); round caps and joins.
         The cloud is a closed line shape that hides the sun, so it gets fill="#FFFFFF".
         The sun ring meets the cloud exactly twice, both near right angles (angle between radii, 90 = perpendicular,
         since |S - C|² ≈ r_sun² + r_lobe²): 90° on the top bump and 90° on the right lobe. At the stroke edges the
         visible yellow corners are 91° and 93° and the background corners outside both lines are 104° and 106°,
         so no thin wedge of yellow or background is left. The right valley lies inside the disc, so the yellow
         is one open region (it reaches y 551, where the ramp is already #F4B63B, close to the main #F2AE2E). -->
    <g id="line" fill="none" stroke="#1C1C1E" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
      <!-- sun: circle r 191 at (620, 426), same as the accent disc -->
      <circle cx="620" cy="426" r="191"/>
      <!-- cloud: ONE closed path. left lobe r 97 at (280, 667); top bump r 150 at (438, 587); right lobe r 115 at (623, 649).
           The left and right lobes sit on the flat base y 764 (cy = 764 - r), so the bottom corners are full round ends.
           Each valley is a concave fillet arc r 80 tangent to both neighbouring lobes (fillet centres (226, 499) and (626, 454),
           each r_lobe + 80 from both lobe centres); the stroke's outer edge there keeps a radius of 80 - 26 = 54.
           Z closes along the base. -->
      <path fill="#FFFFFF" d="M 280 764 A 97 97 0 0 1 250.2 574.7 A 80 80 0 0 0 299.5 529.3 A 150 150 0 0 1 560.4 500.3 A 80 80 0 0 0 624.6 534 A 115 115 0 0 1 623 764 Z"/>
    </g>
  </g>
</svg>
