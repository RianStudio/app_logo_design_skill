<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Halo, a weather app: today's forecast at a glance. Partly sunny: a yellow sun behind the upper right of a
    cloud. The cloud is one closed line (Lucide's cloud, scaled 28 px per unit), the sun the filled accent.
    The sun is a disc r 130 with the cloud's two bumps taken out, each grown by 30 + 60 (half the line plus one
    line width), so it stays one line width clear of the cloud along its whole edge: a crescent, not a chord.
    The cloud's inside is the translucent volume; the sun is the "halo" of the name. Drawn at final size: k = 1.
    Rules and numbers: references/style.md. Layers, attributes and variants: references/construction.md.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26282B"/>
      <stop offset="1" stop-color="#191C1F"/>
    </linearGradient>
    <linearGradient id="body-fill" x1="0" y1="260" x2="0" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#C6C8CB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="113" x2="0" y2="593" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#F2AE2E"/>
    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>
  <!-- transform: k = 1, then (−9.6, −33.1) so the silhouette centroid sits on the centre (render.py prints it).
       data-shape open: a composite shape (cloud plus sun); render.py judges its size by the convex hull.
       render.py: 1 line, accent 11.2 % of the hull, about 60 clear of the cloud, hull 0.96 × Tide. -->
  <g id="subject" data-shape="open" transform="translate(512 512) scale(1) translate(-512 -512) translate(-9.6 -33.1)">
    <!-- volume: the cloud's inside: the cloud's own centre line, filled. Flat white at .14 (Apple HIG: filled, overlapping layers at different
         opacities; the system adds the light). No glow: iOS 26 adds shadow and specular highlights itself -->
    <path id="volume" fill="#FFFFFF" fill-opacity="0.14" d="M 666 756 H 428 A 196 196 0 1 1 615.9 504 H 666 A 126 126 0 1 1 666 756 Z"/>
    <!-- the line drawing: centre lines only, stroke 60, round caps and joins, no fill -->
    <!-- cloud: base y 756 from x 428 to 666; big bump circle (428, 560) r 196, small bump (666, 630) r 126 -->
    <g id="body" fill="none" stroke="url(#body-fill)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 666 756 H 428 A 196 196 0 1 1 615.9 504 H 666 A 126 126 0 1 1 666 756 Z"/>
    </g>
    <!-- accent shape: the sun. python3 scripts/shapes.py minus (circle 690 380 r 130) (circle 428 560 r 286),
         then minus (circle 666 630 r 216): 286 = 196 + 90, 216 = 126 + 90 -->
    <path id="accent-shape" fill="url(#accent)" d="M 576.9 315.8 A 130 130 0 0 1 723.2 254.3 A 130 130 0 0 1 820.0 380.0 A 130 130 0 0 1 795.0 456.7 A 216 216 0 0 0 674.0 414.1 A 286 286 0 0 0 576.9 315.8 Z"/>
  </g>
</svg>
