<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Halo, a weather app: today's forecast at a glance. Partly sunny: a yellow sun behind an ink cloud.
    The cloud is ONE closed line shape with the knock-out fill #FFFFFF, so it hides the sun's lower left.
    Drawn at final size: k = 1, stroke 52, every coordinate is a 1024-canvas pixel before the translate below.
    Rules and numbers: references/style.md. Layers, attributes and variants: references/construction.md.
  -->
  <defs>
    <!-- bg: light #FFFFFF → #EEEEEB; render.py makes the dark and tinted variants -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEB"/>
    </linearGradient>
    <!-- accent: yellow (weather), light #FFD978 → main #F2AE2E.
         Span 480 (k = 1) centred on the sun disc's vertical centre 426: y1 186, y2 666. -->
    <linearGradient id="accent" x1="0" y1="186" x2="0" y2="666" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#F2AE2E"/>
    </linearGradient>
    <!-- lift: one faint shadow under the whole subject (light .10) -->
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="16" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".10"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- transform: k = 1, moved left 12 and up 18 px.
       Wide shape: outer box 680 × 581 px (centre-line x 183..811, y 235..764, plus 26 of stroke on each side).
       That is larger than the 600 × 480 keyline because sun and cloud only partly overlap; the filled silhouette
       is what counts, 0.95 × Tide's.
       Placement: centring the box would leave the silhouette centroid low right, at about (544, 546): the sun and
       the right lobe stack two arcs on the right and the flat base is heavy. After the move the outer box is
       x 145..825, y 191..772 and the silhouette centroid is about (516, 516), within 12 px of (512, 512).
       No #backing: the sun disc and the knock-out cloud fill every enclosed area, so the lift shadow already
       falls only outside. -->
  <g id="subject" data-shape="wide" transform="translate(512 512) scale(1) translate(-512 -512) translate(-12 -18)" filter="url(#lift)">
    <!-- accent shape: the sun disc, r 191 at (620, 426); its whole edge sits on the sun line's centre line.
         The cloud hides its lower left. -->
    <circle id="accent-shape" fill="url(#accent)" cx="620" cy="426" r="191"/>
    <!-- lines: stroke 52 (k = 1); round caps and joins -->
    <g id="line" fill="none" stroke="#1C1C1E" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
      <!-- sun: circle r 191 at (620, 426), same as the accent disc -->
      <circle cx="620" cy="426" r="191"/>
      <!-- cloud: ONE closed path, knock-out fill #FFFFFF.
           Left lobe r 97 at (280, 667); top bump r 150 at (438, 587); right lobe r 115 at (623, 649).
           The left and right lobes sit on the flat base y 764 (cy = 764 − r), so the bottom corners are full round ends.
           Each valley is a concave fillet r 52 tangent to both lobes it joins: centres (246.8, 521.7) and (610.8, 482.4),
           each r_lobe + 52 from both lobe centres; tangent points (258.4, 572.4), (296.0, 538.5) on the left and
           (566.3, 509.4), (614.6, 534.3) on the right. The stroke's outer edge in each valley keeps radius 52 − 26 = 26.
           Z closes along the base.
           The sun ring crosses the cloud twice, at (429.3, 437.3) on the top bump and (720.7, 588.3) on the right lobe,
           both at right angles (the radii meet at 90°), so no thin wedge of yellow or background is left at either
           crossing. The right valley lies inside the disc, so the visible yellow is one region. -->
      <path fill="#FFFFFF" d="M 280.0 764.0 A 97 97 0 0 1 258.4 572.4 A 52 52 0 0 0 296.0 538.5 A 150 150 0 0 1 566.3 509.4 A 52 52 0 0 0 614.6 534.3 A 115 115 0 0 1 623.0 764.0 Z"/>
    </g>
  </g>
</svg>
