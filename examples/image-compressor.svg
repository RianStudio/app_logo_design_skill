<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Image Compressor: a portrait photo (frame + two-peak mountain line) squeezed from both sides by two
    inward chevrons. Accent: the sky above the mountains, blue (default tool colour, natural sky colour).
    Drawn at final size (k = 1), so stroke-width 52 = 52 / 1.
    Geometry: frame 348 x 480 rx 78 (outer 400 x 532); chevron tips 130 from frame (clear 78); ground clear at the ends 88 px,
    under the valley 108 px; second peak rises 64 px above the valley; sky clear above the high peak 178 px.
    Chevron arms at a 1:2 slope (36 run / 72 rise). Width moved out of the chevrons (was 44 x 176) into the frame (was 330 x 450).
    Accent: visible sky about 28% of the subject silhouette, about 6% of the canvas.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEEB"/>
    </linearGradient>
    <!-- accent: blue, light -> main; y1 = frame top 272, y2 = lowest sky edge (mountain ends) 612 -->
    <linearGradient id="accent" x1="0" y1="272" x2="0" y2="612" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7AAEFF"/>
      <stop offset="1" stop-color="#3B7BEA"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="16" result="b"/>
      <feFlood flood-color="#000" flood-opacity=".10"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>

  <!-- k = 1: outer extent x 146..878 (732 wide), y 246..778 (532 tall); bbox centre (512, 512) -->
  <g id="subject" transform="translate(512 512) scale(1) translate(-512 -512) translate(0 0)" filter="url(#lift)">
    <!-- accent: sky = frame interior above the mountain line; edges on the frame and mountain centre lines -->
    <path id="accent-shape" fill="url(#accent)"
          d="M 338 612 V 350 A 78 78 0 0 1 416 272 H 608 A 78 78 0 0 1 686 350 V 612 L 602 528 L 538 592 L 448 502 Z"/>
    <g id="line" fill="none" stroke="#1C1C1E" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
      <!-- photo: 348 x 480 centreline rect centred on (512, 512), rx 78 (22.4% of width); 348:480 ~ 8:11, the Google portrait keyline -->
      <rect x="338" y="272" width="348" height="480" rx="78"/>
      <!-- mountains, every segment at 45 deg (rise = run): ends (338, 612) and (686, 612); peak (448, 502), valley (538, 592), peak (602, 528);
           runs 110 / 90 / 64 / 84 (up runs 110 + 64 = down runs 90 + 84 = 174 = half the frame width) -->
      <path d="M 338 612 L 448 502 L 538 592 L 602 528 L 686 612"/>
      <!-- chevrons: 36 deep, 144 tall, centred on y 512; tips 130 px from the frame side centrelines (78 px clear) -->
      <path d="M 172 440 L 208 512 L 172 584 M 852 440 L 816 512 L 852 584"/>
    </g>
  </g>
</svg>
