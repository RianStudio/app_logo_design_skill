<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- ground: a traditional colour in three tones, lit from above -->
    <radialGradient id="bg" cx="512" cy="40" r="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset=".45" stop-color="#EFE8DA"/>
      <stop offset="1" stop-color="#D9CDB6"/>
    </radialGradient>
    <!-- grain: like the tooth of xuan paper or unglazed clay -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .2  0 0 0 0 .15  0 0 0 0 .1  0 0 0 .06 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="solid" x1="280" y1="330" x2="640" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CC3E0"/>
      <stop offset=".45" stop-color="#3F7FB5"/>
      <stop offset="1" stop-color="#1F4A78"/>
    </linearGradient>
    <filter id="inner-solid" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feOffset dx="-14" dy="-18"/><feGaussianBlur stdDeviation="18" result="s"/>
      <feFlood flood-color="#12304F" flood-opacity=".45"/>
      <feComposite in2="s" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="inner"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="inner"/></feMerge>
    </filter>
    <filter id="elevate" x="-40%" y="-40%" width="180%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="40" result="a"/><feOffset in="a" dy="36" result="a"/>
      <feFlood flood-color="#4A3518" flood-opacity=".38"/><feComposite in2="a" operator="in" result="far"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/><feOffset in="b" dy="12" result="b"/>
      <feFlood flood-color="#4A3518" flood-opacity=".26"/><feComposite in2="b" operator="in" result="mid"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="c"/><feOffset in="c" dy="2" result="c"/>
      <feFlood flood-color="#4A3518" flood-opacity=".2"/><feComposite in2="c" operator="in" result="near"/>
      <feMerge><feMergeNode in="far"/><feMergeNode in="mid"/><feMergeNode in="near"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- celadon glaze: thicker and milkier than glass; what is behind only blushes through -->
    <filter id="through-glaze" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="34"/>
      <feColorMatrix type="saturate" values="1.5"/>
    </filter>
    <linearGradient id="glaze" x1="0" y1="230" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF3F1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#C9D8D6" stop-opacity="0.44"/>
    </linearGradient>
    <!-- glaze pools thicker toward the lower edge: a soft darker band inside the bottom -->
    <filter id="pool" x="-10%" y="-10%" width="120%" height="120%">
      <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feOffset dy="22"/><feGaussianBlur stdDeviation="20" result="s"/>
      <feFlood flood-color="#5E7A86" flood-opacity=".45"/>
      <feComposite in2="s" operator="in"/><feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <linearGradient id="lip" x1="0" y1="230" x2="0" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- the compressed copy (moon-white glaze 月白) 290×290, rx 66: the photo seen through it turns soft, like a lossy copy -->
    <rect id="glaze-shape" x="450" y="230" width="290" height="290" rx="66"/>
    <clipPath id="glaze-clip"><use href="#glaze-shape"/></clipPath>
  </defs>

  <g id="scene">
    <g id="background">
      <rect width="1024" height="1024" fill="url(#bg)"/>
      <rect width="1024" height="1024" fill="#fff" filter="url(#grain)"/>
    </g>
    <!-- subject scaled ×1.55 about the centre to sit on the Apple / Material keyline grid -->
    <g id="glyph" transform="translate(512 512) scale(1.55) translate(-512 -512) translate(2 52)">
      <!-- photo (azurite 石青) 360×360, rx 72: two peaks and a sun in rice-paper white -->
      <g filter="url(#elevate)"><g filter="url(#inner-solid)"><rect x="280" y="330" width="360" height="360" rx="72" fill="url(#solid)"/>
        <path d="M 324 632 L 418 516 L 470 576 L 534 490 L 598 632 Z" fill="#F3EDE0" stroke="#F3EDE0" stroke-width="20" stroke-linejoin="round"/>
        <circle cx="548" cy="420" r="32" fill="#F3EDE0"/></g></g>
    </g>
  </g>

  <!-- glaze: shadow base, blurred scene, celadon body, pooling, broad sheen, a fine lip of light -->
  <g id="glaze" transform="translate(512 512) scale(1.55) translate(-512 -512) translate(2 52)">
    <use href="#glaze-shape" fill="#fff" filter="url(#elevate)"/>
    <g clip-path="url(#glaze-clip)">
      <use href="#scene" transform="translate(-2 -52) translate(512 512) scale(0.64516) translate(-512 -512)" filter="url(#through-glaze)"/>
      <use href="#glaze-shape" fill="url(#glaze)"/>
      <use href="#glaze-shape" fill="#000" filter="url(#pool)"/>
      <ellipse cx="540" cy="290" rx="115" ry="38" fill="#fff" opacity=".42" filter="url(#soft)"/>
    </g>
    <use href="#glaze-shape" fill="none" stroke="url(#lip)" stroke-width="4" clip-path="url(#glaze-clip)"/>
  </g>
</svg>
